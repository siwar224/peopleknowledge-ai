[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peopleknowledge-api"
version = "0.1.0"
description = "RAG API to query the PeopleKnowledge document base."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai>=1.50,<2.0",
    "pdfplumber>=0.11,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pypdf>=5.0,<6.0",
    "python-docx>=1.1,<2.0",
    "pyyaml>=6.0,<7.0",
    "qdrant-client>=1.12,<2.0",
    "sentence-transformers>=3.0,<6.0",  # runs the embedding model (BAAI/bge-m3) locally; pulls torch
    "tokenizers>=0.20,<1.0",  # tokenizer of the embedding model (bge-m3), to measure chunk sizes
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
# Corpus generation (scripts/build_corpus.py): not needed to run the API
corpus = [
    "reportlab>=4.2,<5.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
