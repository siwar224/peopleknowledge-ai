# canonical_policy_rules.yaml
# Source de vérité des règles FICTIVES de NovaTech Solutions.
# Chaque chiffre cité dans un document du corpus doit venir d'ici.
# Ces règles sont des règles de simulation : elles ne décrivent pas le droit du travail tunisien.
#
# Portée actuelle : Lot 1 (HR-001, HR-005, HR-006, HR-011, HR-013, HR-029).
# Les lots 2 et 3 compléteront ce fichier ; ne pas modifier une règle déjà publiée
# sans mettre à jour tous les documents qui la citent.

meta:
