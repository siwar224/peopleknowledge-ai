  manager_response_sla_working_days: 3
  reminder: "relance automatique au manager à J+3 ouvrés"
  escalation: "escalade au head_of_department à J+5 ouvrés sans réponse"
  no_auto_approval: true
  manager_absent: "délégation au head_of_department ou au délégué déclaré dans NovaHR"
  cancellation_before_start: "libre jusqu'à la veille ouvrée du premier jour (avant 17:00)"
  cancellation_after_start: "uniquement via le manager ; les jours non pris sont recrédités"
  modification: "toute modification de dates = nouvelle demande soumise aux délais ; raccourcir une absence ne demande aucun délai"
  refusal_must_be_justified: true
  refusal_reasons: [solde insuffisant, délai de prévenance non respecté, période de gel, couverture d'équipe < 50 %]
  repeated_refusal: "2 refus pour la même période → médiation hr_admin possible"
  probation_requests: "routage automatique vers hr_admin après accord du manager"

