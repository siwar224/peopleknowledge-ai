    min_days_per_year: 10
    consecutive_block: "au moins une période de 5 jours ouvrés consécutifs par an"
  notice_periods:                   # délai entre la soumission et le 1er jour d'absence, en jours ouvrés
    - {duration: "0,5 à 2 jours", notice_working_days: 3}
    - {duration: "3 à 5 jours", notice_working_days: 10}
    - {duration: "6 à 15 jours", notice_working_days: 20}
    - {duration: "plus de 15 jours", notice_working_days: 30}
