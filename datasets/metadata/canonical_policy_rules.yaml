  team_coverage_rule: "au moins 50 % de l'équipe présente chaque jour ouvré"
  advance_leave:
    max_negative_balance_days: 3
    eligible: "CDI ayant terminé leur période d'essai"
    approval: manager
  public_holidays: "non décomptés ; calendrier publié par les RH en décembre"
