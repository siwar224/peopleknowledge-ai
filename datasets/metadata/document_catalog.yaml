# document_catalog.yaml — fiche descriptive de chaque document du corpus (rédigée à la main)
#
# build_manifest.py fusionne ce catalogue avec l'inventaire technique (hash, taille, chemin)
# pour produire document_manifest.jsonl. Le catalogue fait foi pour l'identité et la validité
# des documents ; rien ici n'est déduit du nom de fichier.
#
# Clé de jointure : `file`, chemin relatif à datasets/source_documents/.
# Valeurs autorisées :
#   lifecycle_status : active | archived
#   doc_type         : handbook | policy | procedure | matrix
#   category         : voir document_categories dans company_profile.yaml
#   department_scope : id d'un département ou d'une portée (company_profile.yaml)
# Dates au format AAAA-MM-JJ ; effective_until: null = toujours en vigueur.

